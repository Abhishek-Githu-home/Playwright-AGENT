<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Demo Amazon Store</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="nav">
  <a href="index.html" id="nav-logo">amazon<span style="color:#febd69">.demo</span></a>
  <div class="search-bar">
    <input id="twotabsearchtextbox" type="text" placeholder="Search products..." aria-label="Search" />
    <button id="nav-search-submit-button" aria-label="Go">Search</button>
  </div>
  <a href="cart.html" id="nav-cart">Cart (<span id="nav-cart-count">0</span>)</a>
</header>
<main>
  <h1>Today's Deals</h1>
  <div class="product-grid" id="product-grid"></div>
</main>
<script src="products.js"></script>
<script src="app.js"></script>
<script>
  const grid = document.getElementById('product-grid');
  window.PRODUCTS.forEach((p) => {
    const a = document.createElement('a');
    a.className = 'product-card';
    a.href = `product.html?id=${p.id}`;
    a.dataset.productId = p.id;
    a.innerHTML = `
      <img src="${p.image}" alt="${p.title}" />
      <div class="title">${p.title}</div>
      <div class="price">&#8377;${p.price}<span class="mrp">&#8377;${p.mrp}</span></div>
    `;
    grid.appendChild(a);
  });
</script>
</body>
</html>
